type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - photo
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact id
    example: 68efd41636a23320bb4ef566
  name:
    type: string
    description: Contact name
    example: John Doe
  phoneNumber:
    type: string
    description: Contact phone number
    example: +380000000000
  email:
    type: string
    description: Contact email
    example: johndoe@mail.com
  isFavourite:
    type: boolean
    description: Contact is favourite
    default: false
    example: true
  contactType:
    type: string
    description: Contact type
    enum: ['work', 'home', 'personal']
    example: work
  userId:
    type: string
    description: User id
    example: 68efd834f1781f960b1e7b4x
  photo:
    type: string
    description: Contact photo
    default: null
    example: https://res.cloudinary.com/dha4xvgfi/image/upload/v1759947947/aclxd7sbpsrb8hviowbe.jpg


  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
