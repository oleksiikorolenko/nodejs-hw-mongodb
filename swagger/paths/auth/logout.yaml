tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: Logout user
security:
  - bearerAuth: []
responses:
  '204':
    description: User logged out successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: User logged out successfully
  '401':
    $ref: '../../components/responses/401.yaml'

  '500':
    $ref: '../../components/responses/500.yaml'
